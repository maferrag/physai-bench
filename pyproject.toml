[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physai-bench"
version = "0.1.0"
description = "Evaluation utilities for PhysAI-Bench"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Mohamed Amine Ferrag", email = "mohamed.ferrag@uaeu.ac.ae"},
  {name = "Merouane Debbah"},
  {name = "Abderrahmane Lakas"},
  {name = "Manu Perumkunnil"},
  {name = "Norbert Tihanyi"},
]
keywords = ["physical-ai", "benchmark", "llm", "uav", "agentic-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
physai-bench = "physai_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

